name: Deploy Web to Azure

on:
  # Only deploy after CI has passed — prevents shipping broken code
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # Allow manual re-deploys from the Actions tab
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vardnara-web
  AZURE_RESOURCE_GROUP: vardnara-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    # Skip if triggered by a failed CI run (workflow_dispatch has no conclusion)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: https://vardnara-api.azurewebsites.net

      - name: Package deployment artifact
        run: |
          mkdir -p web_deploy_pkg
          cp -r apps/web/.next/standalone/. web_deploy_pkg/
          mkdir -p web_deploy_pkg/apps/web/public
          cp -r apps/web/public/. web_deploy_pkg/apps/web/public/ 2>/dev/null || true
          cp -r apps/web/.next/static web_deploy_pkg/apps/web/.next/static
          echo "--- Standalone structure ---"
          find web_deploy_pkg -maxdepth 4 -name "server.js"
          ls -lah web_deploy_pkg/
          cd web_deploy_pkg && zip -r ../web-deploy.zip . && cd ..
          echo "Zip size: $(du -sh web-deploy.zip)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "node apps/web/server.js"

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path web-deploy.zip \
            --type zip \
            --timeout 300
