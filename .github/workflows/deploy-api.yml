name: Deploy API to Azure

on:
  push:
    branches: [master]
    paths:
      - 'packages/api/**'
      - 'packages/types/**'
      - 'packages/db/prisma/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vardnara-api
  AZURE_RESOURCE_GROUP: vardnara-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Linux binary)
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Bundle API with esbuild
        run: npm run build:bundle --workspace=packages/api

      - name: Package deployment artifact
        run: |
          mkdir -p deploy_pkg
          cp packages/api/dist/server.bundle.js deploy_pkg/
          echo '{ "type": "module", "name": "vardnara-api", "version": "0.1.0" }' > deploy_pkg/package.json
          mkdir -p deploy_pkg/node_modules
          cp -r node_modules/@prisma deploy_pkg/node_modules/
          cp -r node_modules/.prisma deploy_pkg/node_modules/
          cd deploy_pkg && zip -r ../api-deploy.zip . && cd ..

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path api-deploy.zip \
            --type zip
