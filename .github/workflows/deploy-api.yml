name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/types/**'
      - 'packages/db/prisma/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vardnara-api
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Linux binary)
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Bundle API with esbuild
        run: npm run build:bundle --workspace=packages/api

      - name: Package deployment artifact
        run: |
          mkdir -p deploy_pkg
          # Self-contained bundle
          cp packages/api/dist/server.bundle.js deploy_pkg/
          # Minimal package.json so Node treats files as ESM
          echo '{ "type": "module", "name": "vardnara-api", "version": "0.1.0" }' > deploy_pkg/package.json
          # Prisma client (JS) + generated client with Linux binary engine
          mkdir -p deploy_pkg/node_modules
          cp -r node_modules/@prisma deploy_pkg/node_modules/
          cp -r node_modules/.prisma deploy_pkg/node_modules/
          # Zip for deployment
          cd deploy_pkg && zip -r ../api-deploy.zip . && cd ..

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api-deploy.zip
