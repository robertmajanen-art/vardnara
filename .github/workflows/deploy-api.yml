name: Deploy API to Azure

on:
  # Only deploy after CI has passed — prevents shipping broken code
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # Allow manual re-deploys from the Actions tab
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: vardnara-api
  AZURE_RESOURCE_GROUP: vardnara-rg
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    # Skip if triggered by a failed CI run (workflow_dispatch has no conclusion)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Linux binary)
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Show Prisma binary generated
        run: ls -lah node_modules/.prisma/client/

      - name: Bundle API with esbuild
        run: npm run build:bundle --workspace=packages/api

      - name: Check bundle
        run: |
          echo "Bundle size: $(du -sh packages/api/dist/server.bundle.js)"
          node --check packages/api/dist/server.bundle.js && echo "Bundle syntax OK"

      - name: Package deployment artifact
        run: |
          mkdir -p deploy_pkg
          cp packages/api/dist/server.bundle.js deploy_pkg/
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('node_modules/socket.io/package.json','utf8')).version;
            fs.writeFileSync('deploy_pkg/package.json', JSON.stringify({
              name: 'vardnara-api',
              version: '0.1.0',
              type: 'module',
              scripts: { start: 'node server.bundle.js' },
              dependencies: { 'socket.io': v }
            }, null, 2));
            console.log('socket.io version pinned to', v);
          "
          cd deploy_pkg && npm install --omit=dev --no-package-lock && cd ..
          mkdir -p deploy_pkg/node_modules
          cp -r node_modules/@prisma deploy_pkg/node_modules/
          cp -r node_modules/.prisma deploy_pkg/node_modules/
          echo "--- Deploy package contents ---"
          ls -lah deploy_pkg/
          ls -lah deploy_pkg/node_modules/.prisma/client/
          cd deploy_pkg && zip -r ../api-deploy.zip . && cd ..
          echo "Zip size: $(du -sh api-deploy.zip)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "node server.bundle.js"

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --src-path api-deploy.zip \
            --type zip \
            --timeout 300
