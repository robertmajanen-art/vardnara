name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Suppress the "Node.js 20 actions are deprecated" runner warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Type-check & test ──────────────────────────────────────────────────────
  typecheck-and-test:
    name: Type-check & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vardnara
          POSTGRES_PASSWORD: vardnara
          POSTGRES_DB: vardnara_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://vardnara:vardnara@localhost:5432/vardnara_test
      JWT_SECRET: ci-jwt-secret-not-used-in-prod
      REFRESH_TOKEN_SECRET: ci-refresh-secret-not-used-in-prod
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Type-check — API
        run: npm run typecheck --workspace=packages/api

      - name: Type-check — Web
        run: npm run typecheck --workspace=apps/web

      - name: Test — API
        run: npm run test --workspace=packages/api

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      JWT_SECRET: ci-jwt-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Build — API
        run: npm run build --workspace=packages/api

      - name: Build — Web
        run: npm run build --workspace=apps/web

      - name: Upload API bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: packages/api/dist/
          retention-days: 7

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7
